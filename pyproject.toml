[project]
name = "vcf-automation-mcp"
version = "0.1.0"
description = "MCP server wrapping the VCF Automation (Aria Automation) REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "starlette>=0.27",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
vcf-automation-mcp = "vcf_automation_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcf_automation_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
